name: a12s Vendor Build

on:
  push:
    branches: [a12s-vendor]
  workflow_dispatch:

jobs:
  Vendor:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Checkout stock vendors
      uses: actions/checkout@v6
      with:
        ref: a12s-vendor-stock
        path: stock
    - name: Install tools
      run: |
        sudo apt-get install -y attr patchelf zip unzip autoconf automake libtool pkg-config liblz4-dev uuid-dev zlib1g-dev
        git clone --depth 1 -b v1.9.4 https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git /tmp/erofs-src
        (cd /tmp/erofs-src && ./autogen.sh && ./configure --prefix="$HOME/erofs-utils" && make -j$(nproc) && make install)
        echo "$HOME/erofs-utils/bin" >> "$GITHUB_PATH"
        curl -sSfL -o /tmp/libsepol.tar.gz https://github.com/SELinuxProject/selinux/releases/download/3.11/libsepol-3.11.tar.gz
        echo "79f3d2c88f44b7eb5cf54d9792e03232297e17f97a179163f2750099a00f164d  /tmp/libsepol.tar.gz" | sha256sum -c
        tar xzf /tmp/libsepol.tar.gz -C /tmp
        make -C /tmp/libsepol-3.11/src -j$(nproc) libsepol.a
        gcc -O2 -Wall -Werror -I/tmp/libsepol-3.11/include -o "$HOME/sepatch" vendor/sepatch.c /tmp/libsepol-3.11/src/libsepol.a
    - name: Verify stock vendors
      working-directory: stock
      run: |
        cat a14_stock_vendor.zip.[0-9][0-9] > a14_stock_vendor.zip
        sha256sum -c SHA256SUMS --ignore-missing
        unzip -q a14_stock_vendor.zip
        unzip -q a12s_stock_vendor.zip -d a12s_vendor
        unzip -q xcover5_stock_vendor.zip -d xcover5_vendor
        sha256sum -c SHA256SUMS
    - name: Fetch a12s odm NFC files
      working-directory: stock/a12s_vendor
      run: |
        B=https://gitlab.com/SavedByLight/android_dump_samsung_a12s_bimary-D/-/raw/TP1A.220624.014
        for s in hce hceese hcesim hcesimese; do
          f="odm/etc/vintf/manifest_$s.xml"; echo "$f"
          case $s in hce|hceese) p="nfc.hce nfc.hcef nfc";; *) p="nfc.hce nfc.hcef nfc.uicc nfc";; esac
          case $s in *ese) p="$p nfc.ese";; esac
          for x in $p; do echo "odm/etc/permissions/sku_$s/android.hardware.$x.xml"; done
          echo "odm/etc/permissions/sku_$s/com.nxp.mifare.xml"
        done > odm.list
        echo odm/etc/vintf/manifest_disabled.xml >> odm.list
        while read -r f; do
          mkdir -p "$(dirname "$f")"
          curl -sSfL --retry 5 --retry-delay 20 --retry-all-errors -o "$f" "$B/$f"
        done < odm.list
        rm odm.list
        cat odm/etc/vintf/manifest_hce.xml odm/etc/vintf/manifest_disabled.xml
    - name: Fetch a12s abox firmware
      working-directory: stock/a12s_vendor
      run: |
        B=https://gitlab.com/SavedByLight/android_dump_samsung_a12s_bimary-D/-/raw/TP1A.220624.014/vendor
        mkdir -p firmware
        cat > abox.sha256 <<'EOF'
        f8fbb548f779dc1bcc8a664344e7340e78df26e0863efc299b57e44272f14bd8  firmware/abox_tplg.bin
        b642eb99bbe340d014372df0f193a17b3a71d4226a657c1b739d9f2563b8041a  firmware/abox_tplg.conf
        e663cc0c4ec9f0fd232ec2a097bf63de0c944150c3315bc518b3d9461a677efb  firmware/calliope_dram.bin
        a06c4f6fd394108d0dddd07a787fbd02702589e6624803ae0948d03450108f73  firmware/calliope_dram_2.bin
        396372ba05d7b2bb3ef6bdab8bafbba3f12ec88bae2e62a0a34f7d09c77d063e  firmware/calliope_sram.bin
        e28c50cdbb9db384c10189b10ca6a2048a89004042029c92d47abb3c1520ec31  firmware/calliope_sram_2.bin
        EOF
        while read -r _ f; do
          curl -sSfL --retry 5 --retry-delay 20 --retry-all-errors -o "$f" "$B/$f"
        done < abox.sha256
        sha256sum -c abox.sha256
        rm abox.sha256
    - name: Build vendor
      run: |
        NAME=langsdorff@a12s-$(git rev-parse --short HEAD)_vendor
        mkdir -p dist
        sudo env PATH="$PATH" CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
          bash vendor/mkvendor_a12s.sh stock/a12s_vendor stock/xcover5_vendor stock/vendor_a14.img "dist/$NAME.img"
        sudo env PATH="$PATH" SEPATCH="$HOME/sepatch" bash vendor/mkodm_a12s.sh stock/a12s_vendor stock/odm_a14.img dist/odm.img
        sudo chown "$(id -u):$(id -g)" "dist/$NAME.img" dist/odm.img
        (cd dist && zip -9 -q "$NAME.zip" "$NAME.img" odm.img && rm "$NAME.img" odm.img)
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: a12s-Vendor
        path: dist/*_vendor.zip
