name: a12s Kernel Build

on:
  workflow_dispatch:
  push:
    branches: [xcover5]

jobs:
  Kernel:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [e, p]

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install tools
      run: |
        sudo apt-get install -y pahole libelf-dev bc cpio lz4
        mkdir -p "$HOME/clang"
        curl -sSfL --retry 5 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/84ee9eee62b035acb9a77176979feea20e3068e1/clang-r614150.tar.gz | tar -xz -C "$HOME/clang"
        "$HOME/clang/bin/clang" --version | head -1
    - name: Build
      run: |
        export PATH="$HOME/clang/bin:$PATH"
        VARIANT=${{ matrix.variant }} bash kernel_build/build.sh
        echo "NAME=$(basename kernel_build/langsdorff-a12s-*.tar .tar)" >> "$GITHUB_ENV"
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.NAME }}
        path: |
          kernel_build/${{ env.NAME }}.tar
          kernel_build/${{ env.NAME }}-boot.img
